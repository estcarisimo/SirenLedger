[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siren-ledger"
version = "2.0.0"
description = "Raspberry Pi daemon for emergency vehicle siren detection and logging"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Esteban Carisimo"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy<2.0.0",
    "sounddevice>=0.5.2",
    "tflite-runtime>=2.14.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.11.0",
    "eventlet>=0.35.0",
    "plotly>=5.17.0",
    "click>=8.1.0",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
web = [
    "gunicorn>=22.0.0",
    "flask-cors>=4.0.0",
]

[project.scripts]
siren-counter = "siren_ledger.cli:main"
siren-web = "siren_ledger.web.app:main"

[project.urls]
Homepage = "https://github.com/estcarisimo/SirenLedger"
Repository = "https://github.com/estcarisimo/SirenLedger"
Issues = "https://github.com/estcarisimo/SirenLedger/issues"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=siren_ledger",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["siren_ledger"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs"]