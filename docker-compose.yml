version: '3.8'

services:
  # Main siren detection service
  siren-detector:
    build:
      context: .
      target: production
    container_name: siren-detector
    restart: unless-stopped
    devices:
      # Audio device access
      - "/dev/snd:/dev/snd"
    privileged: true
    group_add:
      - audio
    volumes:
      # Persistent data storage
      - siren-data:/app/data
    environment:
      - SIREN_LOG_LEVEL=INFO
      - SIREN_DATABASE__URL=sqlite:///data/siren_ledger.db
      # Audio configuration
      - SIREN_AUDIO__SAMPLE_RATE=48000
      - SIREN_AUDIO__CHANNELS=2
      # Use default device (remove device_id to use None)
      # Detection configuration
      - SIREN_CONFIDENCE_THRESHOLD=0.20
      # Web service URL for broadcasting
      - SIREN_WEB_URL=http://siren-web:5555
    command: ["siren-counter", "run"]
    healthcheck:
      test: ["CMD", "siren-counter", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - siren-network

  # Web dashboard service
  siren-web:
    build:
      context: .
      target: production
    container_name: siren-web
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      # Shared data with detector service
      - siren-data:/app/data:ro
    environment:
      - SIREN_LOG_LEVEL=INFO
      - SIREN_DATABASE__URL=sqlite:///data/siren_ledger.db
      - FLASK_ENV=production
    command: ["siren-web"]
    depends_on:
      - siren-detector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - siren-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: siren-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - siren-web
    networks:
      - siren-network
    profiles:
      - production

volumes:
  siren-data:
    driver: local

networks:
  siren-network:
    driver: bridge